{% extends "base.html" %}

{% block content %}
<section class="mx-auto" style="max-width: 700px;">
  <a class="btn btn-link px-0 mb-3" href="{{ url_for('products.get_products') }}">&larr; До списку товарів</a>
  <article class="card product-card">
    <div class="card-body p-4">
      <p class="text-muted mb-1">Товар #{{ product.id }}</p>
      <h1 class="card-title">{{ product.name }}</h1>
      <p class="card-text fs-5">{{ product.content }}</p>
      <p class="product-price fs-3 mb-0">${{ product.price }}</p>
    </div>
  </article>
</section>
{% endblock %}
