{% extends "base.html" %}

{% block content %}
<section>
  <h1 class="mb-4">Товари</h1>
  <div class="row g-4">
    {% for product in products %}
      <div class="col-sm-6 col-lg-4">
        <article class="card h-100 product-card">
          <div class="card-body d-flex flex-column">
            <h2 class="card-title h4">{{ product.name }}</h2>
            <p class="card-text text-muted">{{ product.content }}</p>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <span class="product-price">${{ product.price }}</span>
              <a class="btn btn-primary"
                 href="{{ url_for('products.detail_product', id=product.id) }}">Детальніше</a>
            </div>
          </div>
        </article>
      </div>
    {% endfor %}
  </div>
</section>
{% endblock %}
