<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('main.resume') }}">Василинюк Євген Вікторович</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Перемкнути меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'main.home' %}active{% endif %}"
             href="{{ url_for('main.home') }}">Головна</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'main.resume' %}active{% endif %}"
             href="{{ url_for('main.resume') }}">Резюме</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'main.contacts' %}active{% endif %}"
             href="{{ url_for('main.contacts') }}">Контакти</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'products' %}active{% endif %}"
             href="{{ url_for('products.get_products') }}">Товари</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.blueprint == 'posts' %}active{% endif %}"
             href="{{ url_for('posts.get_posts') }}">Пости</a>
        </li>
        {% if current_user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('users.account', 'users.profile', 'users.users_list') %}active{% endif %}"
             href="{{ url_for('users.account') }}">Профіль ({{ current_user.username }})</a>
        </li>
        <li class="nav-item">
          <form method="post" action="{{ url_for('users.logout') }}" class="d-inline">
            <button type="submit" class="nav-link btn btn-link">Вихід</button>
          </form>
        </li>
        {% else %}
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'users.register' %}active{% endif %}"
             href="{{ url_for('users.register') }}">Реєстрація</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'users.login' %}active{% endif %}"
             href="{{ url_for('users.login') }}">Вхід</a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
